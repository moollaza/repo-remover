version: 2
updates:
  # "bun" (not "npm") — the npm ecosystem does not read or update bun.lock,
  # so it bumps package.json alone and leaves the lockfile stale, breaking
  # `bun install --frozen-lockfile` in CI and on Cloudflare Workers Builds.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 4
    groups:
      production:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      production-major:
        dependency-type: "production"
        update-types:
          - "major"
      dev-tooling:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      dev-tooling-major:
        dependency-type: "development"
        update-types:
          - "major"
    ignore:
      # typescript-eslint declares peer `typescript: ">=4.8.4 <6.1.0"`, so TS 7
      # breaks lint/typecheck outright ('TypeError: Cannot read properties of
      # undefined (reading 'Cjs')' in typescript-estree). Confirmed in this
      # repo (#238) and in autobill. Hold until typescript-eslint ships TS >=7
      # support: https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Type definitions — no runtime impact, only noise
      - dependency-name: "@types/*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "@octokit/graphql-schema"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      # Test tooling — no production impact
      - dependency-name: "@testing-library/*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "@playwright/test"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "msw"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      # Formatting/linting — no production impact
      - dependency-name: "prettier"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "eslint-config-prettier"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "@typescript-eslint/*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      # Dev tooling — no production impact
      - dependency-name: "husky"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "lint-staged"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "shadcn"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    commit-message:
      prefix: "fix"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
